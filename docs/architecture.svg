<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="980" height="250" role="img"
     aria-label="Pipeline: camera frame, MediaPipe hand landmarks, normalisation, dense classifier, letter, speech">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3c8ce7"/>
    </marker>
  </defs>

  <g fill="none" stroke="#3c8ce7" stroke-width="1.6">
    <rect x="20"  y="60" width="140" height="96" rx="9">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" dur="4.8s" begin="0s"   repeatCount="indefinite"/>
    </rect>
    <rect x="180" y="60" width="140" height="96" rx="9">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" dur="4.8s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="340" y="60" width="140" height="96" rx="9">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" dur="4.8s" begin="1s"   repeatCount="indefinite"/>
    </rect>
    <rect x="500" y="60" width="140" height="96" rx="9">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" dur="4.8s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="660" y="60" width="140" height="96" rx="9">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" dur="4.8s" begin="2s"   repeatCount="indefinite"/>
    </rect>
    <rect x="820" y="60" width="140" height="96" rx="9">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" dur="4.8s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Segoe UI Semibold, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
     font-size="14" font-weight="700" letter-spacing="1.6" fill="#3c8ce7" text-anchor="middle">
    <text x="90"  y="104">CAMERA</text>
    <text x="250" y="104">MEDIAPIPE</text>
    <text x="410" y="104">NORMALISE</text>
    <text x="570" y="104">CLASSIFIER</text>
    <text x="730" y="104">LETTER</text>
    <text x="890" y="104">SPEECH</text>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
     font-size="11.5" fill="#64748b" text-anchor="middle">
    <text x="90"  y="126">webcam frame</text>
    <text x="250" y="126">21 hand landmarks</text>
    <text x="410" y="126">42 features</text>
    <text x="570" y="126">128 - 64 - 32 - 26</text>
    <text x="730" y="126">A to Z</text>
    <text x="890" y="126">sentence spoken</text>
  </g>

  <g stroke="#3c8ce7" stroke-width="1.6" stroke-opacity="0.55">
    <line x1="160" y1="108" x2="176" y2="108" marker-end="url(#arrow)"/>
    <line x1="320" y1="108" x2="336" y2="108" marker-end="url(#arrow)"/>
    <line x1="480" y1="108" x2="496" y2="108" marker-end="url(#arrow)"/>
    <line x1="640" y1="108" x2="656" y2="108" marker-end="url(#arrow)"/>
    <line x1="800" y1="108" x2="816" y2="108" marker-end="url(#arrow)"/>
  </g>

  <g fill="#5eead4">
    <circle r="3.5" cy="108" cx="160" opacity="0">
      <animate attributeName="cx" values="160;180;180" keyTimes="0;0.104;1" dur="4.8s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.104;1" dur="4.8s" begin="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" cy="108" cx="320" opacity="0">
      <animate attributeName="cx" values="320;340;340" keyTimes="0;0.104;1" dur="4.8s" begin="0.85s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.104;1" dur="4.8s" begin="0.85s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" cy="108" cx="480" opacity="0">
      <animate attributeName="cx" values="480;500;500" keyTimes="0;0.104;1" dur="4.8s" begin="1.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.104;1" dur="4.8s" begin="1.35s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" cy="108" cx="640" opacity="0">
      <animate attributeName="cx" values="640;660;660" keyTimes="0;0.104;1" dur="4.8s" begin="1.85s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.104;1" dur="4.8s" begin="1.85s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" cy="108" cx="800" opacity="0">
      <animate attributeName="cx" values="800;820;820" keyTimes="0;0.104;1" dur="4.8s" begin="2.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.104;1" dur="4.8s" begin="2.35s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
     font-size="12.5" font-style="italic" fill="#64748b" text-anchor="middle">
    <text x="490" y="200">MediaPipe does the heavy vision work, so the classifier only ever sees 42 numbers,</text>
    <text x="490" y="222">which is why a 25 KB model keeps up with a live webcam on a plain CPU.</text>
  </g>
</svg>
