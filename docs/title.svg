<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 215" width="1000" height="215" role="img" aria-label="Sign Language Detection Using Deep-Learning">
  <defs>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-460" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2f6fd0"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2f6fd0"/>
      <animate attributeName="x1" values="-460;1000" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1460" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="154" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#3c8ce7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3c8ce7"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- hand-landmark motif -->
  <circle cx="72" cy="118" r="26" fill="none" stroke="#3c8ce7" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="18;46" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#3c8ce7" stroke-width="2" stroke-linecap="round" fill="#5eead4">
    <g>
      <line x1="72" y1="118" x2="72" y2="74"/>
      <line x1="72" y1="118" x2="48" y2="86"/>
      <line x1="72" y1="118" x2="96" y2="82"/>
      <line x1="72" y1="118" x2="114" y2="102"/>
      <line x1="72" y1="118" x2="34" y2="112"/>
      <circle cx="72" cy="118" r="5"/>
      <circle cx="72" cy="74" r="4"/>
      <circle cx="48" cy="86" r="4"/>
      <circle cx="96" cy="82" r="4"/>
      <circle cx="114" cy="102" r="4"/>
      <circle cx="34" cy="112" r="4"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="-4 72 118; 4 72 118; -4 72 118" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="150" y="96"
        font-family="Segoe UI Semibold, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="2" fill="url(#shimmer)">SIGN LANGUAGE DETECTION</text>
  <text x="150" y="148"
        font-family="Segoe UI Semibold, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="8.5" fill="url(#shimmer)">USING DEEP-LEARNING</text>

  <line x1="154" y1="170" x2="700" y2="170" stroke="url(#rule)" stroke-width="2"
        stroke-dasharray="546" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="546" to="0" dur="1.4s" fill="freeze"/>
  </line>

  <text x="154" y="196"
        font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="4.2" fill="#64748b">REAL-TIME ASL TO TEXT TO SPEECH</text>
</svg>
